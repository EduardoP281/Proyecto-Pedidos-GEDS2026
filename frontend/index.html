<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title> Sistema de Catálogo y Gestión de Productos</title>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Tailwind Configuration -->
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "background": "#f8fafc",
            "surface": "#ffffff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f8fafc",
            "surface-container": "#f1f5f9",
            "surface-container-high": "#e2e8f0",
            "surface-container-highest": "#cbd5e1",
            "outline": "#94a3b8",
            "outline-variant": "#e2e8f0",
            "on-surface": "#0f172a",
            "on-surface-variant": "#475569",
            "primary": "#2563eb",
            "on-primary": "#ffffff",
            "primary-container": "#dbeafe",
            "on-primary-container": "#1e40af",
            "secondary": "#475569",
            "secondary-container": "#f1f5f9",
            "error": "#ef4444",
            "error-container": "#fee2e2"
          },
          borderRadius: {
            "DEFAULT": "0.375rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline-xl": ["Hanken Grotesk", "Inter", "sans-serif"],
            "headline-lg": ["Hanken Grotesk", "Inter", "sans-serif"],
            "headline-md": ["Hanken Grotesk", "Inter", "sans-serif"],
            "headline-sm": ["Hanken Grotesk", "Inter", "sans-serif"],
            "body-lg": ["Inter", "sans-serif"],
            "body-md": ["Inter", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "label-md": ["Inter", "sans-serif"],
            "label-sm": ["Inter", "sans-serif"],
            "tabular-data": ["Inter", "sans-serif"]
          }
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
